name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: system dependencies (tesseract + ocr data + opencv runtime)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng libgl1 libglib2.0-0
      - name: install core + backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "core[dev]"
          python -m pip install -e backend
      - name: pytest
        working-directory: core
        run: python -m pytest -v --tb=short

