name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: system dependencies (tesseract + ocr data + opencv runtime)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng libgl1 libglib2.0-0
      - name: install core + backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "core[dev]"
          python -m pip install -e backend
      - name: pytest
        working-directory: core
        run: |
          set -o pipefail
          python -m pytest -v --tb=short 2>&1 | tee pytest_output.txt
        shell: bash
      - name: publish test summary
        if: always()
        working-directory: core
        run: |
          echo "### Pytest Summary (${{ matrix.python }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 60 pytest_output.txt >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
        shell: bash


