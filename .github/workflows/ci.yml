name: CI
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: system dependencies (tesseract + ocr data + opencv runtime)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng libgl1 libglib2.0-0
      - name: install core + backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "core[dev]"
          python -m pip install -e backend
      - name: pytest
        working-directory: core
        run: |
          set -o pipefail
          python -m pytest -v --tb=short 2>&1 | tee pytest_output.txt
        shell: bash
      - name: annotate failures
        if: always()
        run: |
          python -c '
          import os
          path = "core/pytest_output.txt"
          if os.path.exists(path):
              with open(path, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()
              for line in content.splitlines():
                  if line.startswith("FAILED ") or line.startswith("ERROR "):
                      print(f"::error title=Pytest Failure::{line}")
              # Print the failures section
              if "=== FAILURES ===" in content:
                  fail_sec = content.split("=== FAILURES ===")[1].split("=== short test summary info ===")[0]
                  for chunk in fail_sec.strip().split("\n\n")[:5]:
                      first_line = chunk.splitlines()[0] if chunk.splitlines() else "Failure"
                      details = "%0A".join(chunk.splitlines()[:25])
                      print(f"::error title={first_line}::{details}")
          '
      - name: upload pytest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-${{ matrix.python }}
          path: core/pytest_output.txt



