name: android-compile

on:
  push:
    paths:
      - "apps/mobile/android/**"
      - "core/**"                 # netra_core is embedded via Chaquopy — core changes can break the app build
  pull_request:
    paths:
      - "apps/mobile/android/**"
      - "core/**"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4   # gradle + dependency caching
      - name: Compile Kotlin (no emulator needed)
        run: ./gradlew :app:compileDebugKotlin --no-daemon
