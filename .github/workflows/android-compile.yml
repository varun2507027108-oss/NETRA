name: android-compile

on:
  push:
    paths:
      - "apps/mobile/android/**"
      - "core/**"                 # netra_core is embedded via Chaquopy — core changes can break the app build
  pull_request:
    paths:
      - "apps/mobile/android/**"
      - "core/**"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NETRA_BUILD_PYTHON: python
    defaults:
      run:
        working-directory: apps/mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"
      - name: Write local.properties (flutter.sdk for settings.gradle.kts)
        run: |
          FLUTTER_SDK_PATH="${FLUTTER_ROOT:-$(dirname "$(dirname "$(which flutter)")")}"
          echo "flutter.sdk=$FLUTTER_SDK_PATH" > local.properties
          cat local.properties
      - name: Resolve Flutter dependencies
        working-directory: apps/mobile
        run: flutter pub get
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: gradle/actions/setup-gradle@v4   # gradle + dependency caching
      - name: Compile Kotlin (no emulator needed)
        run: ./gradlew :app:compileDebugKotlin --no-daemon
