[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netra-core"
version = "0.1.0"
description = "NETRA — offline statutory compliance engine for packaged commodities (SIH26034)"
requires-python = ">=3.9"
dependencies = []   # the core must install ANYWHERE — including Chaquopy/Android.
                    # Native deps (reportlab/pillow) live in extras; the Chaquopy
                    # spike then decides which of them the device round can carry.

[project.optional-dependencies]
dossier = ["reportlab>=4.0", "pillow>=10.0"]
ocr = ["pytesseract>=0.3.10"]
bridge = ["fastapi>=0.110", "uvicorn>=0.29"]
crypto = ["cryptography>=42"]
dev = ["pytest>=7.4", "ruff>=0.4", "opencv-python", "numpy",
       "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29", "cryptography>=42",
       "pytesseract>=0.3.10", "reportlab>=4.0", "pillow>=10.0"]

[tool.setuptools.packages.find]
include = ["netra_core*"]

[tool.setuptools.package-data]
netra_core = ["vision_config.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]