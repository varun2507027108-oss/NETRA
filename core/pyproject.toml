[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netra-core"
version = "0.1.0"
description = "NETRA — offline statutory compliance engine for packaged commodities (SIH26034)"
requires-python = ">=3.9"
dependencies = ["reportlab>=4.0", "pillow>=10.0"]   # dossier rendering (rules layer stays stdlib-only)

[project.optional-dependencies]
bridge = ["fastapi>=0.110", "uvicorn>=0.29"]
crypto = ["cryptography>=42"]
dev = ["pytest>=7.4", "ruff>=0.4", "opencv-python", "numpy",
       "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29", "cryptography>=42"]

[tool.setuptools.packages.find]
include = ["netra_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]