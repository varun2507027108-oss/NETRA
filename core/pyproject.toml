[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netra-core"
version = "0.1.0"
description = "NETRA — offline statutory compliance engine for packaged commodities (SIH26034)"
requires-python = ">=3.9"
dependencies = []            # rules layer is stdlib-only by design

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4", "opencv-python", "numpy"]

[tool.setuptools.packages.find]
include = ["netra_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]